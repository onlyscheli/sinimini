<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startseite</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #fbfbfb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100vh;
      padding: 20px;
    }

    /* Spruch über dem Monster */
    #spruchBox {
      font-size: 1.8rem;
      font-weight: bold;
      color: #000000;
      text-align: center;
      margin-bottom: 20px;
      min-height: 2.2em; /* Verhindert ein Verspringen des Bildes */
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 90vw;
    }

    .hero-image {
      max-width: 85vw;
      max-height: 70vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      #spruchBox {
        font-size: 1.3rem;
        margin-bottom: 15px;
      }
      .hero-image {
        max-width: 92vw;
        max-height: 75vh;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <!-- Spruch-Anzeige OBER DEM MONSTER -->
    <div id="spruchBox"></div>

    <!-- Normales Monsterbild -->
    <img
      id="monsterBild"
      src="1792330313428.jpg"
      alt="Monster"
      class="hero-image"
    >

    <!-- Monsteranimation -->
    <video
      id="monsterVideo"
      class="hero-image"
      playsinline
      preload="auto"
      style="display: none;"
    ></video>

    <!-- Audiosprech-Element -->
    <audio id="monsterAudio" preload="auto"></audio>
  </div>

  <script>
    const bild = document.getElementById("monsterBild");
    const video = document.getElementById("monsterVideo");
    const audio = document.getElementById("monsterAudio");
    const spruchBox = document.getElementById("spruchBox");

    // Liste aller Animationen (1 bis 20)
    const animationen = [
      "blume", "drehen", "flirten", "gehen", "hallo", 
      "handstand", "herz", "hüpfen", "kreis", "kuss", 
      "lachen", "niesen", "posieren", "schweben", 
      "seitensprünge", "singen", "stern", "tanzen", 
      "verliebt", "zwinkern"
    ];

    // Liste aller Sprüche
    const sprueche = [
      "Du schaffst das",
      "Glaub an dich",
      "Vertrau auf dein Bauchgefühl",
      "Du bist stärkst",
      "Bleib dir treu",
      "Lade Scheli heute auf einen Kaffee ein",
      "Du packst das",
      "Mach es einfach",
      "Mut steht dir gut",
      "Deine Zeit ist jetzt",
      "Kopf hoch Sini",
      "Heute ist dein Tag",
      "Glaub an deine Stärke",
      "Schritt für Schritt",
      "Ein Prost auf dich",
      "Nutze deine Chance",
      "Hol dir, was dir zusteht",
      "Hör auf dein Herz Sini",
      "Ein schöner Moment wartet",
      "Glaub an deine Träume",
      "Dein Lächeln wirkt Wunder",
      "Gute Nachrichten nahen",
      "Nimm das Geschenk an",
      "Der Weg ist das Ziel",
      "Lade Scheli heute auf ein Bierli ein",
      "Überraschung naht",
      "Die Sterne stehen gut",
      "Offenheit bringt Glück",
      "Bleib wie du bist Sini",
      "Ein Wunsch geht in Erfüllung",
      "Glaube an Wunder",
      "Was wäre, wenn es klappt?",
      "Neue Türen öffnen sich",
      "Genieße den Augenblick",
      "Lache herzlich heute",
      "Heute strahlst du",
      "Genieße die Stille",
      "Sammle schöne Momente",
      "Lass die Seele baumeln",
      "Du hast dir heute ein Bier verdient",
      "Du bist die coolste Socke hier",
      "Heute ist dein offizieller Gönn-dir-Tag",
      "Mach einfach mal nix – und das gründlich",
      "Kalorien zählen heute nicht",
      "Du bist absolut unersetzlich",
      "Du siehst fantastisch aus",
      "Es ist nie zu früh für Feierabend",
      "Heute gibt's nix, Sini!",
      "Heute hast du dir 2 Bier verdient",
      "Lass es dir heute richtig gut gehen",
      "Trau dich, Sini",
      "Sei mutig und frech",
      "Glück beginnt mit einem Lächeln",
      "Ein bisschen Verrücktheit tut gut",
      "Sini, worauf wartest du noch?",
      "Heute ist der perfekte Tag für ein Prost",
      "Dein Sofa vermisst dich schon",
      "Erst Kaffee, dann die Welt retten",
      "Du bist ein Original",
      "Gute Freunde, gutes Bier, guter Tag!",
      "Scheiß drauf, Sini!",
      "Wer nicht wagt, der nicht gewinnt"
    ];

    // Zähler für geordnete Reihenfolge
    let animIndex = 0;
    let spruchIndex = 0;

    function animationStarten() {
      // Aktuelles Video/Audio und Spruch aus den Listen holen
      const wahl = animationen[animIndex];
      const spruch = sprueche[spruchIndex];

      // Zähler für den nächsten Klick hochzählen (und am Ende wieder bei 0 anfangen)
      animIndex = (animIndex + 1) % animationen.length;
      spruchIndex = (spruchIndex + 1) % sprueche.length;

      // Quellen setzen
      video.src = `Monster_${wahl}.mp4`;
      audio.src = `Monster_${wahl}.mp3`;

      // Spruch oben eintragen
      spruchBox.textContent = spruch;

      // Bild verstecken, Video einblenden
      bild.style.display = "none";
      video.style.display = "block";

      video.currentTime = 0;
      audio.currentTime = 0;

      // Gleichzeitig abspielen
      const playVideo = video.play();
      const playAudio = audio.play();

      if (playVideo !== undefined) {
        playVideo.catch(() => {
          resetAnsicht();
        });
      }
      if (playAudio !== undefined) {
        playAudio.catch(() => {
          // Falls Audio vom Browser geblockt wird
        });
      }
    }

    function resetAnsicht() {
      video.style.display = "none";
      bild.style.display = "block";
      video.currentTime = 0;
      audio.currentTime = 0;
    }

    bild.addEventListener("click", animationStarten);

    // Wenn das Video vorbei ist, wieder das JPG zeigen
    video.addEventListener("ended", function () {
      resetAnsicht();
    });
  </script>

</body>
</html>
