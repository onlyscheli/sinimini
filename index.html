<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startseite</title>
  <style>
    /* Grundlegendes Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Reinweißer Hintergrund & Zentrierung des Inhalts */
    body {
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden; /* Verhindert Scrollbalken */
    }

    /* Optimiertes Bild: groß, zentriert und voll responsive */
    .hero-image {
      max-width: 85vw;    /* Nimmt auf großen Bildschirmen bis zu 85% der Breite ein */
      max-height: 85vh;   /* Nimmt bis zu 85% der Höhe ein */
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    /* Optimierung für Mobilgeräte / Hochformat */
    @media (max-width: 768px) {
      .hero-image {
        max-width: 92vw;  /* Nutzen auf dem Handy etwas mehr Platz */
        max-height: 92vh;
      }
    }
  </style>
</head>
<body>

  <img src="Monster_hüpfen.mp4" alt="Startseiten Bild" class="hero-image">

</body>
</html>
